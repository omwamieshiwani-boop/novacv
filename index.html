        function Counter({ to, duration = 1400 }) {
            const [val, setVal] = useState(0);
            useEffect(() => {
                let start = null;
                const step = (ts) => {
                    if (!start) start = ts;
                    const p = Math.min((ts - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - p, 3);
                    setVal(Math.floor(to * eased));
                    if (p < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }, [to, duration]);
            return <span>{val.toLocaleString()}</span>;
        }
        
        function Badge({ children, tone = 'default', dot }) {
            const tones = {

                red: 'bg-rose-400/10 text-rose-300 border-rose-400/20',
            };
            return (
                <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium border ${tones[tone]}`}>
                    {dot && <span className={`w-1.5 h-1.5 rounded-full ${tone === 'green' ? 'bg-emerald-400' : tone === 'red' ? 'bg-rose-400' : 'bg-white/50'}`} />}

            return <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...props}>{children}</button>;
